
<svg xmlns="http://www.w3.org/2000/svg"
     width="340" height="90"
     viewBox="0 0 340 90">

  <defs>
    <pattern id="dots"
             width="4" height="4"
             patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4"
              fill="#F4D35E"/>
    </pattern>
  </defs>

  <!-- Window background -->
  <rect x="2" y="2" width="336" height="86"
        rx="8" 
        stroke="#A88B35" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="17" cy="16" r="3" fill="#ECF704"/>
  <circle cx="29" cy="16" r="3" fill="#C9A83D"/>
  <circle cx="41" cy="16" r="3" fill="#806D35"/>

  <!-- Window divider -->
  <path d="M2 29 H338"
        stroke="#4A4025" stroke-width="1"/>

  <!-- Dotted text -->
  <text x="170" y="65"
        text-anchor="middle"
        font-family="Courier New, monospace"
        font-size="31"
        font-weight="bold"
        letter-spacing="1"
        fill="url(#dots)">
    Hello World
  </text>

</svg>
