<svg width="860" height="190" viewBox="0 0 860 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#9BBF00" flood-opacity="0.55" />
    </filter>

    
    <filter id="sideBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" />
    </filter>

    
    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="78%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>
    <mask id="fadeMask">
      <rect x="0" y="0" width="860" height="190" fill="url(#edgeFade)" />
    </mask>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; font-size: 15px; fill: #9BBF00; }
      .desc  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 500; font-size: 12px; fill: #E8D8B8; }
      .stack { font-family: monospace; font-size: 11px; fill: #8b949e; }
      .btn   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; font-size: 11px; fill: #0d1117; }

      @keyframes floatCenter {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-5px); }
      }
      @keyframes driftLeft {
        0%, 100% { transform: translate(20px, 28px) scale(0.84); opacity: 0.42; }
        50%      { transform: translate(28px, 25px) scale(0.86); opacity: 0.58; }
      }
      @keyframes driftRight {
        0%, 100% { transform: translate(555px, 28px) scale(0.84); opacity: 0.42; }
        50%      { transform: translate(547px, 25px) scale(0.86); opacity: 0.58; }
      }
      .center-card { animation: floatCenter 4s ease-in-out infinite; }
      .left-card   { animation: driftLeft 5s ease-in-out infinite; }
      .right-card  { animation: driftRight 5s ease-in-out infinite; }
    </style>
  </defs>

  <g mask="url(#fadeMask)">
    
    <g class="left-card" filter="url(#sideBlur)">
      <rect x="0" y="0" width="336" height="125" rx="14" fill="#161b22" stroke="#9BBF00" stroke-width="1" />
      <text x="20" y="32" class="title">🥛 MilkCheck Model Card</text>
      <text x="20" y="56" class="desc">ML evaluation suite &amp; automated model cards.</text>
      <text x="20" y="84" class="stack">Python • Pandas • Pytest</text>
      <rect x="226" y="92" width="90" height="22" rx="11" fill="#9BBF00" />
      <text x="271" y="107" text-anchor="middle" class="btn">Explore →</text>
    </g>

    
    <g class="right-card" filter="url(#sideBlur)">
      <rect x="0" y="0" width="336" height="125" rx="14" fill="#161b22" stroke="#9BBF00" stroke-width="1" />
      <text x="20" y="32" class="title">📱 Cross-Platform Mobile App</text>
      <text x="20" y="56" class="desc">Mobile app configured for Android EAS builds.</text>
      <text x="20" y="84" class="stack">TypeScript • React • Expo</text>
      <rect x="226" y="92" width="90" height="22" rx="11" fill="#9BBF00" />
      <text x="271" y="107" text-anchor="middle" class="btn">Explore →</text>
    </g>

    
    <g class="center-card" transform="translate(262, 18)">
      <rect x="0" y="0" width="336" height="132" rx="14" fill="#161b22" stroke="#9BBF00" stroke-width="1.5" filter="url(#neonGlow)" />
      <text x="20" y="34" class="title">🎓 Nexus Student Management</text>
      <text x="20" y="58" class="desc">Full-stack student management API &amp; backend.</text>
      <text x="20" y="88" class="stack">Node.js • Express • PostgreSQL</text>
      <rect x="226" y="96" width="90" height="22" rx="11" fill="#9BBF00" />
      <text x="271" y="111" text-anchor="middle" class="btn">Explore →</text>
    </g>
  </g>
</svg>
