<svg width="860" height="190" viewBox="0 0 860 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#9BBF00" flood-opacity="0.55" />
    </filter>

    
    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <mask id="fadeMask">
      <rect x="0" y="0" width="860" height="190" fill="url(#edgeFade)" />
    </mask>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; font-size: 15px; fill: #9BBF00; }
      .desc  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 500; font-size: 12px; fill: #E8D8B8; }
      .stack { font-family: monospace; font-size: 11px; fill: #8b949e; }
      .btn   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; font-size: 11px; fill: #0d1117; }

      /* Slot 1: Starts Center -&gt; Moves Left -&gt; Moves Right -&gt; Returns Center */
      @keyframes cycle1 {
        0%, 26%   { transform: translate(262px, 22px) scale(1);    opacity: 1;    filter: blur(0px); }
        33%, 59%  { transform: translate(24px,  32px) scale(0.84); opacity: 0.42; filter: blur(2.2px); }
        66%, 93%  { transform: translate(554px, 32px) scale(0.84); opacity: 0.42; filter: blur(2.2px); }
        100%      { transform: translate(262px, 22px) scale(1);    opacity: 1;    filter: blur(0px); }
      }

      /* Slot 2: Starts Right -&gt; Moves Center -&gt; Moves Left -&gt; Returns Right */
      @keyframes cycle2 {
        0%, 26%   { transform: translate(554px, 32px) scale(0.84); opacity: 0.42; filter: blur(2.2px); }
        33%, 59%  { transform: translate(262px, 22px) scale(1);    opacity: 1;    filter: blur(0px); }
        66%, 93%  { transform: translate(24px,  32px) scale(0.84); opacity: 0.42; filter: blur(2.2px); }
        100%      { transform: translate(554px, 32px) scale(0.84); opacity: 0.42; filter: blur(2.2px); }
      }

      /* Slot 3: Starts Left -&gt; Moves Right -&gt; Moves Center -&gt; Returns Left */
      @keyframes cycle3 {
        0%, 26%   { transform: translate(24px,  32px) scale(0.84); opacity: 0.42; filter: blur(2.2px); }
        33%, 59%  { transform: translate(554px, 32px) scale(0.84); opacity: 0.42; filter: blur(2.2px); }
        66%, 93%  { transform: translate(262px, 22px) scale(1);    opacity: 1;    filter: blur(0px); }
        100%      { transform: translate(24px,  32px) scale(0.84); opacity: 0.42; filter: blur(2.2px); }
      }

      .card-1 { animation: cycle1 12s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .card-2 { animation: cycle2 12s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .card-3 { animation: cycle3 12s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    </style>
  </defs>

  <g mask="url(#fadeMask)">
    
    <g class="card-1">
      <rect x="0" y="0" width="336" height="132" rx="14" fill="#161b22" stroke="#9BBF00" stroke-width="1.4" filter="url(#neonGlow)" />
      <text x="20" y="34" class="title">🎓 Nexus Student Management</text>
      <text x="20" y="58" class="desc">Full-stack student management API &amp; backend.</text>
      <text x="20" y="88" class="stack">Node.js • Express • PostgreSQL</text>
      <rect x="226" y="96" width="90" height="22" rx="11" fill="#9BBF00" />
      <text x="271" y="111" text-anchor="middle" class="btn">Explore →</text>
    </g>

    
    <g class="card-2">
      <rect x="0" y="0" width="336" height="132" rx="14" fill="#161b22" stroke="#9BBF00" stroke-width="1.4" filter="url(#neonGlow)" />
      <text x="20" y="34" class="title">🥛 MilkCheck Model Card</text>
      <text x="20" y="58" class="desc">ML evaluation suite &amp; automated model cards.</text>
      <text x="20" y="88" class="stack">Python • Pandas • Pytest</text>
      <rect x="226" y="96" width="90" height="22" rx="11" fill="#9BBF00" />
      <text x="271" y="111" text-anchor="middle" class="btn">Explore →</text>
    </g>

    
    <g class="card-3">
      <rect x="0" y="0" width="336" height="132" rx="14" fill="#161b22" stroke="#9BBF00" stroke-width="1.4" filter="url(#neonGlow)" />
      <text x="20" y="34" class="title">📱 Cross-Platform Mobile App</text>
      <text x="20" y="58" class="desc">Mobile app configured for Android EAS builds.</text>
      <text x="20" y="88" class="stack">TypeScript • React • Expo</text>
      <rect x="226" y="96" width="90" height="22" rx="11" fill="#9BBF00" />
      <text x="271" y="111" text-anchor="middle" class="btn">Explore →</text>
    </g>
  </g>
</svg>
