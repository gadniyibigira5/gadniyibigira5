  <text x="28" y="92" class="stack">Node.js • Express • PostgreSQL</text>
  <rect x="242" y="100" width="90" height="22" rx="11" fill="#9BBF00" />
  <text x="287" y="115" text-anchor="middle" class="btn">Explore →</text>
</svg>
